name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build (node-server, as deployed by Dokploy)
        run: pnpm build:all
        env:
          NITRO_PRESET: node-server

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: eyadex
          POSTGRES_USER: eyadex_owner
          POSTGRES_PASSWORD: ci-only-owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eyadex_owner -d eyadex"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: eyadex_owner
      PGPASSWORD: ci-only-owner
      PGDATABASE: eyadex
    steps:
      - uses: actions/checkout@v4
      - name: Create runtime roles (PRD 4.5)
        run: |
          for r in app auth platform dispatcher; do
            psql -v ON_ERROR_STOP=1 -qc "CREATE ROLE eyadex_$r LOGIN NOBYPASSRLS PASSWORD 'ci-only-$r'"
          done
      - name: Apply the SQL baseline (db/migrate.sh)
        run: sh db/migrate.sh
      - name: Migration status is clean
        run: sh db/migrate.sh --status
      - name: RLS + grant negative isolation tests
        run: for f in db/tests/*.sql; do echo "$f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Migration runner self-test
        run: sh db/tests/migrate-runner.sh
      - name: Platform team backfill (0037) holds each email, fails on a clinic hold
        run: sh db/tests/platform-backfill.sh
      # @eyadex/db runs against the same database this job just migrated. The passwords are the
      # ci-only-* ones the runtime roles were created with above; the owner URL is for the fixtures
      # and the assertions only — the owner role never reaches the application (CLAUDE.md §5).
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/api test:db imports its workspace dependencies from dist (observability, contracts, ids…).
      - run: pnpm --filter @eyadex/db... --filter @eyadex/auth... --filter "@eyadex/api^..." --filter "@eyadex/worker^..." build
      - name: Tenant wrapper database tests (@eyadex/db)
        run: pnpm --filter @eyadex/db test:db
        env:
          EYADEX_TEST_OWNER_URL: postgres://eyadex_owner:ci-only-owner@localhost:5432/eyadex
          EYADEX_TEST_APP_URL: postgres://eyadex_app:ci-only-app@localhost:5432/eyadex
          EYADEX_TEST_PLATFORM_URL: postgres://eyadex_platform:ci-only-platform@localhost:5432/eyadex
      - name: API database tests — tenancy, identity, auth over HTTP (@eyadex/api)
        run: pnpm --filter @eyadex/api test:db
        env:
          EYADEX_TEST_OWNER_URL: postgres://eyadex_owner:ci-only-owner@localhost:5432/eyadex
          EYADEX_TEST_APP_URL: postgres://eyadex_app:ci-only-app@localhost:5432/eyadex
          EYADEX_TEST_AUTH_URL: postgres://eyadex_auth:ci-only-auth@localhost:5432/eyadex
          EYADEX_TEST_PLATFORM_URL: postgres://eyadex_platform:ci-only-platform@localhost:5432/eyadex
          EYADEX_TEST_REDIS_URL: redis://localhost:6379/0
      - name: Worker dispatcher database tests (@eyadex/worker)
        run: pnpm --filter @eyadex/worker test:db
        env:
          EYADEX_TEST_OWNER_URL: postgres://eyadex_owner:ci-only-owner@localhost:5432/eyadex
          EYADEX_TEST_APP_URL: postgres://eyadex_app:ci-only-app@localhost:5432/eyadex
          EYADEX_TEST_DISPATCHER_URL: postgres://eyadex_dispatcher:ci-only-dispatcher@localhost:5432/eyadex
          EYADEX_TEST_PLATFORM_URL: postgres://eyadex_platform:ci-only-platform@localhost:5432/eyadex
      - name: Better Auth database tests (@eyadex/auth)
        run: pnpm --filter @eyadex/auth test:db
        env:
          EYADEX_TEST_OWNER_URL: postgres://eyadex_owner:ci-only-owner@localhost:5432/eyadex
          EYADEX_TEST_AUTH_URL: postgres://eyadex_auth:ci-only-auth@localhost:5432/eyadex

  # The API's production image (apps/api/Dockerfile) must keep building, and must answer its health
  # check as the non-root user — the same image Dokploy deploys (ADR-0007).
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t eyadex-api:ci .
      # The image's own CMD must boot: health answers, the auth handler is mounted, and the running process
      # is the non-root user. No database or Redis is needed for that — postgres.js and the auth pools are
      # lazy, and Redis failures only matter on rate-limited routes — so the URLs point nowhere.
      - name: Boot the image and probe it
        run: |
          docker run -d --name api -p 127.0.0.1:3000:3000 \
            -e DATABASE_URL=postgres://eyadex_app:ci@127.0.0.1:1/eyadex \
            -e AUTH_DATABASE_URL=postgres://eyadex_auth:ci@127.0.0.1:1/eyadex \
            -e BETTER_AUTH_SECRET="$(openssl rand -hex 32)" -e REDIS_URL=redis://127.0.0.1:1/0 \
            -e PLATFORM_DATABASE_URL=postgres://eyadex_platform:ci@127.0.0.1:1/eyadex \
            -e OUTBOX_SEAL_KEY="$(openssl rand -base64 32)" -e MAIL_PROVIDER_SEAL_KEY="$(openssl rand -base64 32)" \
            -e APP_URL=https://app.eyadex.test -e PLATFORM_URL=https://platform.eyadex.test \
            eyadex-api:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/v1/health && break; sleep 1; done
          test "$(curl -s http://127.0.0.1:3000/v1/health)" = '{"status":"ok"}'
          # Unknown host on the auth handler → 404 envelope: the Better Auth bundle loaded.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/auth/sign-in/email)" = "404"
          test "$(docker exec api whoami)" = "eyadex"
      - name: API container log
        if: always()
        run: docker logs api || true

  # The worker's production image (apps/worker/Dockerfile, ADR-0015) must build, boot its own CMD as the
  # non-root user, report readiness honestly, and stop cleanly. Both pools are lazy, so the URLs point nowhere.
  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the worker image
        run: docker build -f apps/worker/Dockerfile -t eyadex-worker:ci .
      - name: Boot the image and probe it
        run: |
          docker run -d --name worker -p 127.0.0.1:3002:3002 \
            -e DATABASE_URL=postgres://eyadex_app:ci@127.0.0.1:1/eyadex \
            -e DISPATCHER_DATABASE_URL=postgres://eyadex_dispatcher:ci@127.0.0.1:1/eyadex \
            -e OUTBOX_SEAL_KEY="$(openssl rand -base64 32)" -e MAIL_PROVIDER_SEAL_KEY="$(openssl rand -base64 32)" \
            -e PLATFORM_DATABASE_URL=postgres://eyadex_platform:ci@127.0.0.1:1/eyadex \
            -e APP_URL=https://app.eyadex.test -e PLATFORM_URL=https://platform.eyadex.test \
            -e RESEND_API_KEY=re_ci_dummy \
            -e MAIL_FROM="Eyadex CI <ci@eyadex.test>" \
            eyadex-worker:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3002/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3002/health)" = "200"
          # The pools cannot connect: readiness must say so instead of answering 200.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3002/health/ready)" = "503"
          test "$(docker exec worker whoami)" = "eyadex"
          # The clean shutdown path (useProcessExit) exits 0 well inside the 45 s watchdog.
          docker stop -t 60 worker
          test "$(docker inspect -f '{{.State.ExitCode}}' worker)" = "0"
          # No secret value in the log.
          if docker logs worker 2>&1 | grep -q re_ci_dummy; then echo "secret in worker log"; exit 1; fi
      - name: Worker container log
        if: always()
        run: docker logs worker || true
