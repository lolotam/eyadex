name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit -p .
      - name: Lint
        run: bun run lint
      - name: Test
        run: bunx vitest run
      - name: Build (node-server, as deployed by Dokploy)
        run: bun run build
        env:
          NITRO_PRESET: node-server

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: eyadex
          POSTGRES_USER: eyadex_owner
          POSTGRES_PASSWORD: ci-only-owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eyadex_owner -d eyadex"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: eyadex_owner
      PGPASSWORD: ci-only-owner
      PGDATABASE: eyadex
    steps:
      - uses: actions/checkout@v4
      - name: Create runtime roles (PRD 4.5)
        run: |
          for r in app auth platform dispatcher; do
            psql -v ON_ERROR_STOP=1 -qc "CREATE ROLE eyadex_$r LOGIN NOBYPASSRLS PASSWORD 'ci-only-$r'"
          done
      - name: Apply the SQL baseline (db/migrate.sh)
        run: sh db/migrate.sh
      - name: Migration status is clean
        run: sh db/migrate.sh --status
      - name: RLS + grant negative isolation tests
        run: for f in db/tests/*.sql; do echo "$f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Migration runner self-test
        run: sh db/tests/migrate-runner.sh
