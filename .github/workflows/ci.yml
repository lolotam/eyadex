name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit -p .
      - name: Lint
        run: bun run lint
      - name: Test
        run: bunx vitest run
      - name: Build (node-server, as deployed by Dokploy)
        run: bun run build
        env:
          NITRO_PRESET: node-server
