name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository and publishes build artifacts, so the job token stays
# read-only instead of the default broad permissions.
permissions:
  contents: read

jobs:
  # Typecheck, lint and the unit suites. The package tests already parallelize their files; avoid
  # competing Vitest pools starving I/O, so the suites stay sequential inside this job.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm exec turbo run test --concurrency=1

  # The deployed artifact build. Its only real prerequisite is the install, so it starts on its own
  # runner instead of waiting behind the unit suites. The preset is the one Dokploy builds.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (node-server, as deployed by Dokploy)
        run: pnpm build:all
        env:
          NITRO_PRESET: node-server

  # The database gate: the schema proofs and the runtime suites are independent, so they run as
  # isolated shards instead of one long job.
  db:
    uses: ./.github/workflows/ci-db.yml

  # The production and research images. At most two builds run at a time: each build compiles
  # native code and unpacks fonts, and the hosted runner has 16 GB of memory.
  images:
    uses: ./.github/workflows/ci-images.yml
