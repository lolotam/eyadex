name: CI database gate

# Called by ci.yml. The schema proofs and the runtime suites are independent, so each family runs
# in its own job: the old single `db` job was the critical path of every measured run, and its two
# runtime suites never needed the same database or the same runner.

on:
  workflow_call:

# The called jobs only read the repository; the token stays read-only.
permissions:
  contents: read

jobs:
  # The schema half: the baseline, the negative isolation proofs and the backfill scripts. It needs
  # no workspace install and no Redis, so it starts and finishes first.
  schema:
    name: schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: eyadex
          POSTGRES_USER: eyadex_owner
          POSTGRES_PASSWORD: ci-only-owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eyadex_owner -d eyadex"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: eyadex_owner
      PGPASSWORD: ci-only-owner
      PGDATABASE: eyadex
    steps:
      - uses: actions/checkout@v4
      - name: Create runtime roles (PRD 4.5)
        run: |
          for r in app auth platform dispatcher; do
            psql -v ON_ERROR_STOP=1 -qc "CREATE ROLE eyadex_$r LOGIN NOBYPASSRLS PASSWORD 'ci-only-$r'"
          done
      - name: Apply the SQL baseline (db/migrate.sh)
        run: sh db/migrate.sh
      - name: Migration status is clean
        run: sh db/migrate.sh --status
      - name: RLS + grant negative isolation tests
        run: for f in db/tests/*.sql; do echo "$f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Migration runner self-test
        run: sh db/tests/migrate-runner.sh
      - name: Platform team backfill (0037) holds each email, fails on a clinic hold
        run: sh db/tests/platform-backfill.sh
      - name: Admin key backfill (0042) reaches locked admin roles only
        run: sh db/tests/admin-keys-backfill.sh
      - name: Medical release (0050) upgrades system roles only, matches the catch-up
        run: sh db/tests/medical-release-backfill.sh
      - name: Finance release catch-up (0063) is the migration's role statement
        run: sh db/tests/finance-release-catch-up.sh

  # The tenant wrapper and Better Auth database suites. They share one schema but no runtime
  # service, so they stay together in one shard instead of paying a second baseline apply.
  packages:
    name: packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: eyadex
          POSTGRES_USER: eyadex_owner
          POSTGRES_PASSWORD: ci-only-owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eyadex_owner -d eyadex"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: eyadex_owner
      PGPASSWORD: ci-only-owner
      PGDATABASE: eyadex
    steps:
      - uses: actions/checkout@v4
      - name: Create runtime roles (PRD 4.5)
        run: |
          for r in app auth platform dispatcher; do
            psql -v ON_ERROR_STOP=1 -qc "CREATE ROLE eyadex_$r LOGIN NOBYPASSRLS PASSWORD 'ci-only-$r'"
          done
      - name: Apply the SQL baseline (db/migrate.sh)
        run: sh db/migrate.sh
      - name: Migration status is clean
        run: sh db/migrate.sh --status
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/api test:db imports its workspace dependencies from dist (observability, contracts, ids…).
      - run: pnpm --filter @eyadex/db... --filter @eyadex/auth... --filter "@eyadex/api^..." --filter "@eyadex/worker..." build
      - name: Tenant wrapper database tests (@eyadex/db)
        run: pnpm --filter @eyadex/db test:db
        env:
          EYADEX_TEST_OWNER_URL: postgres://eyadex_owner:ci-only-owner@localhost:5432/eyadex
          EYADEX_TEST_APP_URL: postgres://eyadex_app:ci-only-app@localhost:5432/eyadex
          EYADEX_TEST_PLATFORM_URL: postgres://eyadex_platform:ci-only-platform@localhost:5432/eyadex
      - name: Better Auth database tests (@eyandex/auth)
        run: pnpm --filter @eyadex/auth test:db
        env:
          EYADEX_TEST_OWNER_URL: postgres://eyadex_owner:ci-only-owner@localhost:5432/eyadex
          EYADEX_TEST_AUTH_URL: postgres://eyadex_auth:ci-only-auth@localhost:5432/eyadex

  # The API database suite is the longest suite in the gate. It is split by file into isolated
  # shards: each shard owns its own fresh database, so the shards cannot race each other, and a
  # failing shard fails only itself. The coverage is the same suite, only distributed.
  api:
    name: api (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: eyadex
          POSTGRES_USER: eyadex_owner
          POSTGRES_PASSWORD: ci-only-owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eyadex_owner -d eyadex"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: eyadex_owner
      PGPASSWORD: ci-only-owner
      PGDATABASE: eyadex
    steps:
      - uses: actions/checkout@v4
      - name: Create runtime roles (PRD 4.5)
        run: |
          for r in app auth platform dispatcher; do
            psql -v ON_ERROR_STOP=1 -qc "CREATE ROLE eyadex_$r LOGIN NOBYPASSRLS PASSWORD 'ci-only-$r'"
          done
      - name: Apply the SQL baseline (db/migrate.sh)
        run: sh db/migrate.sh
      - name: Migration status is clean
        run: sh db/migrate.sh --status
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eyadex/db... --filter @eyadex/auth... --filter "@eyadex/api^..." --filter "@eyadex/worker..." build
      # The attachments' S3 store (spec §6, docs/specs/medical-blob-runbook.md). Not a `services:` entry:
      # the image's default command does not start a server and service containers take no command. MinIO
      # publishes source only now, so the image is the pgsty community build, pinned by tag and digest. The
      # ci-only-* credentials exist only inside this job's throwaway container.
      - name: Start MinIO and create the test bucket
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=ci-only-minio -e MINIO_ROOT_PASSWORD=ci-only-minio-pass \
            "$MINIO_IMAGE" server /data
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/ready && break; sleep 1; done
          curl -sf http://127.0.0.1:9000/minio/health/ready
          # The image carries the mc client: the bucket is created from inside the same container.
          docker exec -e MC_HOST_ci=http://ci-only-minio:ci-only-minio-pass@127.0.0.1:9000 \
            minio mc mb ci/eyadex-medical-ci
        env:
          MINIO_IMAGE: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
      - name: API database tests — tenancy, identity, auth over HTTP, the S3 blob store (@eyadex/api)
        run: pnpm --filter @eyadex/api exec vitest run --config vitest.db.config.ts --shard=${{ matrix.shard }}
        env:
          EYADEX_TEST_OWNER_URL: postgres://eyadex_owner:ci-only-owner@localhost:5432/eyadex
          EYADEX_TEST_APP_URL: postgres://eyadex_app:ci-only-app@localhost:5432/eyadex
          EYADEX_TEST_AUTH_URL: postgres://eyadex_auth:ci-only-auth@localhost:5432/eyadex
          EYADEX_TEST_PLATFORM_URL: postgres://eyadex_platform:ci-only-platform@localhost:5432/eyadex
          # The export flow forks a separate worker using its own dispatcher role.
          EYADEX_TEST_DISPATCHER_URL: postgres://eyadex_dispatcher:ci-only-dispatcher@localhost:5432/eyadex
          EYADEX_TEST_REDIS_URL: redis://localhost:6379/0
          MEDICAL_BLOB_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          MEDICAL_BLOB_S3_TEST_BUCKET: eyadex-medical-ci
          MEDICAL_BLOB_S3_TEST_ACCESS_KEY: ci-only-minio
          MEDICAL_BLOB_S3_TEST_SECRET_KEY: ci-only-minio-pass

  # The worker database suite keeps its own shard: it drives the dispatcher role and the export
  # pipeline, and it shares the database with nothing else.
  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: eyadex
          POSTGRES_USER: eyadex_owner
          POSTGRES_PASSWORD: ci-only-owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eyadex_owner -d eyadex"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: eyadex_owner
      PGPASSWORD: ci-only-owner
      PGDATABASE: eyadex
    steps:
      - uses: actions/checkout@v4
      - name: Create runtime roles (PRD 4.5)
        run: |
          for r in app auth platform dispatcher; do
            psql -v ON_ERROR_STOP=1 -qc "CREATE ROLE eyadex_$r LOGIN NOBYPASSRLS PASSWORD 'ci-only-$r'"
          done
      - name: Apply the SQL baseline (db/migrate.sh)
        run: sh db/migrate.sh
      - name: Migration status is clean
        run: sh db/migrate.sh --status
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eyadex/db... --filter @eyadex/auth... --filter "@eyadex/api^..." --filter "@eyadex/worker..." build
      - name: Worker dispatcher database tests (@eyandex/worker)
        run: pnpm --filter @eyadex/worker test:db
        env:
          EYADEX_TEST_OWNER_URL: postgres://eyadex_owner:ci-only-owner@localhost:5432/eyadex
          EYADEX_TEST_APP_URL: postgres://eyadex_app:ci-only-app@localhost:5432/eyadex
          EYADEX_TEST_DISPATCHER_URL: postgres://eyadex_dispatcher:ci-only-dispatcher@localhost:5432/eyadex
          EYADEX_TEST_PLATFORM_URL: postgres://eyadex_platform:ci-only-platform@localhost:5432/eyadex
