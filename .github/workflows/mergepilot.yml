# MergePilot (lolotam/MergePilot): an Arabic AI review on every PR, on the owner's Claude subscription
# through the official Claude Code CLI. The token is a repository secret the owner adds
# (CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`); no one else ever handles it.
name: MergePilot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mergepilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # A fork's PR gets no secrets and must never run the reviewer on its own code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Review Pull Request
        uses: lolotam/MergePilot@main
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
