packages:
  - "apps/*"
  - "packages/*"

# pnpm reads overrides from this file, not from package.json — a top-level "overrides" key there is
# ignored. One rolldown for vite and nitro (bun.lock pinned 1.2.1; the lock resolved 1.1.5 / 1.2.12
# without it).
# pnpm is enforced through engines.pnpm. package.json has no "packageManager" field, and its
# devEngines.packageManager (which turbo needs to find the workspace) uses onFail "ignore": either
# of the other forms makes pnpm 12 write a second YAML document at the top of pnpm-lock.yaml, and
# single-document scanners (GitHub's dependency graph) would then see no dependencies and raise no
# vulnerability alerts.
overrides:
  rolldown: 1.2.1
  # Parent selectors only (pnpm docs: "qar@1>zoo"). A bare zod@4.6.5 selector rewrote unrelated
  # peer ranges in the lockfile, including @hookform/resolvers and better-call. These three parents
  # declare zod ^4.5.4, so 4.6.6 stays inside their range. Zod 3 consumers are not selected.
  "@tanstack/router-generator@1.167.40>zod": "4.6.6"
  "@tanstack/router-plugin@1.168.42>zod": "4.6.6"
  "@tanstack/start-plugin-core@1.171.49>zod": "4.6.6"
  # Same Vite advisory's launch-editor package. Parent range is ^2.14.1, so 2.14.2 is compatible.
  "launch-editor@2.14.1": "2.14.2"

# 24h supply-chain guard (carried over from bunfig.toml): skip package versions published less than
# a day ago. pnpm expresses the age in minutes.
minimumReleaseAge: 1440
# Each entry bypasses the 24h guard for one package — confirm with the user before adding any.
minimumReleaseAgeExclude:
  - "@lovable.dev/vite-tanstack-config"
  - "@lovable.dev/mcp-js"
  - "@lovable.dev/email-js"
  - "@lovable.dev/webhooks-js"

# Packages whose install scripts may run. esbuild (pulled in by drizzle-kit) stays off: its platform
# binary arrives as an optional dependency, so the postinstall adds nothing we need.
allowBuilds:
  esbuild: false
