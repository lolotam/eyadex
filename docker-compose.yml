# Eyadex local / staging stack (PRD §4.14).
# Today: web + postgres + redis. api + worker arrive in Phase B (NestJS) — stubs below.
# Usage:  cp .env.example .env  &&  docker compose up -d --build

name: eyadex

services:
  web:
    build:
      context: .
      # Compiled into the bundle by Vite (see Dockerfile); "http" needs the api service on /api.
      args:
        VITE_API_MODE: ${VITE_API_MODE:-mock}
        # ADR-0021: empty = the production host rules; a staging-like stack names both hosts.
        VITE_APP_HOST: ${VITE_APP_HOST:-}
        VITE_PLATFORM_HOST: ${VITE_PLATFORM_HOST:-}
    image: eyadex-web:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eyadex}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-eyadex_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
      # Runtime roles created by docker/postgres/init (PRD §4.5). None has BYPASSRLS.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD in .env}
      DISPATCHER_DB_PASSWORD: ${DISPATCHER_DB_PASSWORD:?set DISPATCHER_DB_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep the cluster under /var/lib/postgresql/18/docker; a PG16 data
      # directory cannot be opened by 18, so 18 uses its own volume (the old pgdata is left as is).
      - pgdata18:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./db:/db:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" # local only, never public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379" # local only, never public
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 320m

  # The attachments' private S3 bucket (spec §6, docs/specs/medical-blob-runbook.md). The S3 port is published
  # on 127.0.0.1 only, for an API run on the host; the web console is never published. MinIO now ships
  # source only, so the image is the pgsty community build, pinned like CI.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000" # local only, never public
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  # One-shot: creates the bucket the API expects (the API never creates it) with the image's own mc client.
  # Safe to re-run.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ["mc"]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    command: ["mb", "--ignore-existing", "local/${MEDICAL_BLOB_S3_BUCKET:-eyadex-medical}"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # ---- Phase B (NestJS on Fastify, same code, two entry points) ----
  # api:
  #   build: ../eyadex-api            # monorepo apps/api later
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgres://eyadex_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-eyadex}
  #     REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  #   depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  # worker:
  #   build: ../eyadex-api
  #   command: ["node", "dist/worker.js"]
  #   restart: unless-stopped
  #   depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }

volumes:
  pgdata18:
  redisdata:
  miniodata:
